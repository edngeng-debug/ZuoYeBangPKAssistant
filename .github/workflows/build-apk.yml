name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          test -f ZuoYeBangPKAssistant_Project.zip
          unzip -q ZuoYeBangPKAssistant_Project.zip -d project
          cp -a project/. .
          rm -rf project ZuoYeBangPKAssistant_Project.zip

      - name: Fix Android SDK version
        shell: bash
        run: |
          set -e
          sed -i \
            's/compileSdk = 34/compileSdk = 35/g;
             s/targetSdk = 34/targetSdk = 35/g;
             s/compileSdk 34/compileSdk 35/g;
             s/targetSdk 34/targetSdk 35/g' \
            app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZuoYeBangPKAssistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk        uses: actions/upload-artifact@v4
        with:
          name: ZuoYeBangPKAssistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
